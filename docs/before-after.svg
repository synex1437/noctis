<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="The same night with and without noctis, as an illustration: Claude Code alone waits out the 01:40 limit, then stops at 03:20 with 21 of 48 tasks done; with noctis all 48 are done by 06:55">
  <title>The same night, with and without</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d10"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.85" cy="0.75" r="0.55">
      <stop offset="0" stop-color="#ff1f3d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="work" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4a5c"/>
      <stop offset="1" stop-color="#d4142e"/>
    </linearGradient>
    <linearGradient id="workDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f2a36"/>
      <stop offset="1" stop-color="#6a1524"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a40" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff2a40" stop-opacity="0.8"/>
      <stop offset="0.75" stop-color="#ff2a40" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff2a40" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#111115"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#2b2b32" stroke-width="2.5"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="frame">
      <rect x="0.5" y="0.5" width="1199" height="379" rx="18"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; }
      .cap { font-size: 15px; fill: #a3a3ad; }
      .tick { font-size: 13px; fill: #6f6f79; }
      .row { font-size: 17px; font-weight: 800; }
      .sub { font-size: 13px; fill: #6f6f79; }
      .in { font-size: 13px; font-weight: 600; }
      .res { font-size: 14px; font-weight: 700; }
      .leg { font-size: 13px; fill: #8f8f99; }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#ember)"/>
    <rect x="0" y="377" width="1200" height="3" fill="url(#rule)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="18" fill="none" stroke="#24242b"/>
  <text x="30" y="36" class="sans cap">The same night — 48 queued tasks, nobody at the keyboard <tspan fill="#6f6f79">(an illustration, not a measurement)</tspan></text>

  <g class="mono tick" text-anchor="middle">
    <text x="200" y="78">23:00</text>
    <text x="411" y="78">01:00</text>
    <text x="622" y="78">03:00</text>
    <text x="833" y="78">05:00</text>
    <text x="1044" y="78">07:00</text>
  </g>
  <g stroke="#1a1a20">
    <line x1="200" y1="86" x2="200" y2="318"/>
    <line x1="411" y1="86" x2="411" y2="318"/>
    <line x1="622" y1="86" x2="622" y2="318"/>
    <line x1="833" y1="86" x2="833" y2="318"/>
    <line x1="1044" y1="86" x2="1044" y2="318"/>
  </g>
  <line x1="1150" y1="60" x2="1150" y2="318" stroke="#a3a3ad" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1142" y="50" class="sans" font-size="13" fill="#a3a3ad" text-anchor="end">☀ 08:00 you wake up</text>

  <!-- without: Claude Code alone -->
  <text x="30" y="126" class="sans row" fill="#8f8f99">Without</text>
  <text x="30" y="146" class="sans sub">Claude Code alone</text>
  <rect x="200" y="110" width="281" height="44" rx="8" fill="url(#workDim)"/>
  <text x="340" y="132" class="sans in" fill="#f0d5d9" text-anchor="middle" dominant-baseline="central">working · 14 tasks</text>
  <rect x="481" y="110" width="97" height="44" fill="#1b1b20"/>
  <text class="sans in" fill="#8f8f99" text-anchor="middle" dominant-baseline="central"><tspan x="536" y="124">waits for</tspan><tspan x="536" y="140">the reset</tspan></text>
  <rect x="578" y="110" width="79" height="44" fill="url(#workDim)"/>
  <text x="614" y="132" class="sans in" fill="#f0d5d9" text-anchor="middle" dominant-baseline="central">7 tasks</text>
  <rect x="657" y="110" width="493" height="44" rx="8" fill="url(#hatch)" stroke="#24242b"/>
  <text x="910" y="132" class="sans in" fill="#8f8f99" text-anchor="middle" dominant-baseline="central">03:20 Claude ends its turn — nobody to say continue</text>
  <circle cx="481" cy="132" r="13" fill="#0a0a0c" stroke="#d7d7dd" stroke-width="2.2"/>
  <path transform="translate(481 132)" d="M -4.5 -4.5 L 4.5 4.5 M 4.5 -4.5 L -4.5 4.5" stroke="#d7d7dd" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="650" y="125" width="14" height="14" rx="2" fill="#d7d7dd" stroke="#0a0a0c" stroke-width="2"/>
  <text x="1140" y="176" class="sans res" fill="#8f8f99" text-anchor="end">21 / 48 tasks by morning</text>

  <!-- with noctis -->
  <text x="30" y="246" class="sans row" fill="#ff3347">With</text>
  <text x="30" y="266" class="sans sub">noctis</text>
  <rect x="200" y="226" width="836" height="52" rx="12" fill="#ff1f3d" opacity="0.18" filter="url(#soft)"/>
  <rect x="200" y="230" width="281" height="44" rx="8" fill="url(#work)"/>
  <text x="340" y="252" class="sans in" fill="#ffffff" text-anchor="middle" dominant-baseline="central">working · 14 tasks</text>
  <rect x="481.75" y="230.75" width="95.5" height="42.5" fill="#160a0d" stroke="#ff3347" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g transform="translate(497 244)" fill="#ff3347">
    <rect x="0" y="-6" width="3.5" height="12" rx="1"/>
    <rect x="6" y="-6" width="3.5" height="12" rx="1"/>
  </g>
  <text class="sans in" fill="#ffd6db" dominant-baseline="central"><tspan x="512" y="244">waits</tspan><tspan x="501" y="260">56 min</tspan></text>
  <rect x="578" y="230" width="458" height="44" rx="8" fill="url(#work)"/>
  <rect x="578" y="230" width="20" height="44" fill="url(#work)"/>
  <text x="807" y="252" class="sans in" fill="#ffffff" text-anchor="middle" dominant-baseline="central">continues the same turn · 34 more tasks</text>
  <rect x="1036" y="230" width="114" height="44" rx="8" fill="#111115" stroke="#24242b"/>
  <text x="1098" y="252" class="sans in" fill="#6f6f79" text-anchor="middle" dominant-baseline="central">nothing left</text>
  <circle cx="1036" cy="252" r="13" fill="#0a0a0c" stroke="#ff3347" stroke-width="2.5"/>
  <path transform="translate(1036 252)" d="M -5 0.5 L -1.5 4 L 5 -3.5" fill="none" stroke="#ff3347" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1140" y="316" class="sans res" fill="#f5f5f7" text-anchor="end"><tspan fill="#ff3347">48 / 48 tasks</tspan> · finished 06:55 · notification (+ webhook, if set)</text>

  <g class="sans leg">
    <rect x="30" y="345" width="14" height="10" rx="2" fill="url(#work)"/>
    <text x="50" y="355">working</text>
    <rect x="126.75" y="345.75" width="12.5" height="8.5" rx="1.5" fill="#160a0d" stroke="#ff3347" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="146" y="355">noctis waits inside the hook, context kept</text>
    <rect x="441" y="345" width="14" height="10" rx="2" fill="url(#hatch)" stroke="#2b2b32"/>
    <text x="461" y="355">idle, nobody to say continue</text>
    <path transform="translate(676 350)" d="M -4 -4 L 4 4 M 4 -4 L -4 4" stroke="#d7d7dd" stroke-width="2" stroke-linecap="round"/>
    <text x="688" y="355">usage-limit wall</text>
    <rect x="814" y="345" width="10" height="10" rx="1.5" fill="#d7d7dd"/>
    <text x="830" y="355">Claude ended its turn</text>
    <path transform="translate(1000 350)" d="M -4.5 0.4 L -1.4 3.5 L 4.5 -3.4" fill="none" stroke="#ff3347" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1011" y="355">queue finished</text>
  </g>
</svg>
