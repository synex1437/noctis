<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Noctis — AI coding agents that work through the night">
  <title>Noctis</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#151d2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#4f8ff7" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#4f8ff7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ff7"/>
      <stop offset="1" stop-color="#38c7d9"/>
    </linearGradient>
    <linearGradient id="loopBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ff7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4f8ff7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38c7d9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2a44"/>
      <stop offset="1" stop-color="#0f1626"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif; }
      .mono { font-family: "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; }
      .chip { font-size: 17px; font-weight: 500; fill: #dbe2ec; }
      .icon { font-weight: 700; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <path d="M 120 250 C 120 60 520 60 640 250 C 760 440 1160 440 1160 250 C 1160 60 760 60 640 250 C 520 440 120 440 120 250 Z" fill="none" stroke="url(#loopBg)" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="80" y="70" width="240" height="240" rx="54" fill="url(#tile)" stroke="#2b3b5a"/>
  </g>
  <rect x="81" y="71" width="238" height="116" rx="53" fill="#ffffff" fill-opacity="0.035"/>
  <g transform="translate(288 102)">
    <circle cx="0" cy="0" r="14" fill="#f5d67a" opacity="0.95"/>
    <circle cx="6.5" cy="-4" r="12" fill="#152036"/>
  </g>
  <g transform="translate(200 190)">
    <path d="M -76 0 C -76 -45 -29 -45 0 0 C 29 45 76 45 76 0 C 76 -45 29 -45 0 0 C -29 45 -76 45 -76 0 Z" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="29" stroke-linejoin="round" transform="translate(0 6)"/>
    <path d="M -76 0 C -76 -45 -29 -45 0 0 C 29 45 76 45 76 0 C 76 -45 29 -45 0 0 C -29 45 -76 45 -76 0 Z" fill="none" stroke="url(#loop)" stroke-width="25" stroke-linejoin="round"/>
    <path d="M -76 0 C -76 -45 -29 -45 0 0" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="372" y="104" class="sans" font-size="15" font-weight="700" fill="#7f8ea3" letter-spacing="2">NOCTIS · CLAUDE CODE · CODEX CLI · ANTIGRAVITY CLI · DROID · COPILOT CLI</text>
  <text x="370" y="170" class="sans" font-size="58" font-weight="800" fill="#f2f5f9" letter-spacing="-1">AI coding agents that work</text>
  <text x="370" y="232" class="sans" font-size="58" font-weight="800" fill="#f2f5f9" letter-spacing="-1">through the night.</text>
  <text x="372" y="276" class="sans" font-size="23" fill="#a9b3c2">Stops before the usage-limit wall, saves, waits, resumes —</text>
  <text x="372" y="306" class="sans" font-size="23" fill="#a9b3c2">and keeps your task queue moving while you sleep.</text>

  <g class="sans chip">
    <rect x="372" y="330" width="197" height="40" rx="20" fill="#121a29" stroke="#2a3548"/>
    <text x="470.5" y="351" text-anchor="middle" dominant-baseline="central"><tspan class="icon" fill="#f5b544">⚡</tspan><tspan dx="7">5–11 ms per hook</tspan></text>
    <rect x="581" y="330" width="242" height="40" rx="20" fill="#121a29" stroke="#2a3548"/>
    <text x="702" y="351" text-anchor="middle" dominant-baseline="central"><tspan class="icon" fill="#3ecf8e">◎</tspan><tspan dx="7">0 tokens per decision</tspan></text>
    <rect x="835" y="330" width="180" height="40" rx="20" fill="#121a29" stroke="#2a3548"/>
    <text x="925" y="351" text-anchor="middle" dominant-baseline="central"><tspan class="icon" fill="#38c7d9">▣</tspan><tspan dx="7">one Go binary</tspan></text>
    <rect x="1027" y="330" width="205" height="40" rx="20" fill="#121a29" stroke="#2a3548"/>
    <text x="1129.5" y="351" text-anchor="middle" dominant-baseline="central"><tspan class="icon" fill="#a78bfa">⊞</tspan><tspan dx="7">Win · Mac · Linux</tspan></text>
  </g>

  <rect x="80.5" y="410.5" width="1119" height="170" rx="14" fill="#0d1320" stroke="#26303f"/>
  <circle cx="104" cy="434" r="6" fill="#ff5f57"/>
  <circle cx="126" cy="434" r="6" fill="#febc2e"/>
  <circle cx="148" cy="434" r="6" fill="#28c840"/>
  <g class="mono" font-size="18">
    <text x="104" y="478" fill="#7f8ea3">02:36</text>
    <g fill="#f5b544"><rect x="172" y="465" width="4" height="13" rx="1"/><rect x="180" y="465" width="4" height="13" rx="1"/></g>
    <text x="192" y="478" fill="#f5b544">5h limit 92%: waited 56m, continuing.</text>
    <text x="104" y="510" fill="#7f8ea3">06:55</text>
    <text x="172" y="510" fill="#3ecf8e">✔ Queue finished — TASKS.md has no open items; stopping cleanly.</text>
  </g>
  <line x1="104" y1="530" x2="1176" y2="530" stroke="#1d2634"/>
  <text x="104" y="560" class="mono" font-size="19" fill="#c7cfda">∞ 5h %61→07:35 · Wk %71●→Mon 21.09 09:00 · Opus 5.5/max · ctx 52%</text>
  <text x="1200" y="616" class="sans" font-size="15" fill="#8b95a5" text-anchor="end">Claude Code · Codex · Antigravity · Droid · Copilot · MIT</text>
</svg>
