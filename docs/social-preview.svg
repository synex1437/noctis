<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Noctis — AI coding agents that work through the night: pauses before the usage limit, waits for the reset and resumes">
  <title>Noctis</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d10"/>
      <stop offset="1" stop-color="#040405"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#ff1f3d" stop-opacity="0.36"/>
      <stop offset="0.45" stop-color="#ff1f3d" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon" cx="0.5" cy="1.08" r="0.62">
      <stop offset="0" stop-color="#ff1f3d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b78"/>
      <stop offset="0.5" stop-color="#ff2a40"/>
      <stop offset="1" stop-color="#b30f26"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1f"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b4e" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ff3b4e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a40" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff2a40" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#ff2a40" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff2a40" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gridFade" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" x="0" y="0">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <mask id="gridMask">
      <rect width="1280" height="640" fill="url(#gridFade)"/>
    </mask>
    <mask id="moonCut">
      <rect x="-20" y="-20" width="40" height="40" fill="#ffffff"/>
      <circle cx="7" cy="-5" r="13" fill="#000000"/>
    </mask>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif; }
      .name { font-size: 84px; font-weight: 800; fill: #f5f5f7; letter-spacing: -2px; }
      .h1 { font-size: 31px; font-weight: 700; fill: #f5f5f7; letter-spacing: -0.3px; }
      .red { fill: #ff3347; }
      .h2 { font-size: 21px; fill: #a3a3ad; }
      .chip { font-size: 17px; font-weight: 500; fill: #e4e4e8; }
      .foot { font-size: 15px; fill: #6f6f79; letter-spacing: 0.4px; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#horizon)"/>
  <rect x="0" y="636" width="1280" height="4" fill="url(#rule)"/>

  <!-- logo tile -->
  <g filter="url(#shadow)">
    <rect x="550" y="58" width="180" height="180" rx="42" fill="url(#tile)"/>
  </g>
  <rect x="550.75" y="58.75" width="178.5" height="178.5" rx="41.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <rect x="552" y="60" width="176" height="80" rx="40" fill="#ffffff" fill-opacity="0.03"/>
  <g transform="translate(640 152) scale(0.72)">
    <path d="M -78 0 C -78 -46 -30 -46 0 0 C 30 46 78 46 78 0 C 78 -46 30 -46 0 0 C -30 46 -78 46 -78 0 Z" fill="none" stroke="#ff1f3d" stroke-opacity="0.55" stroke-width="30" stroke-linejoin="round" filter="url(#soft)"/>
    <path d="M -78 0 C -78 -46 -30 -46 0 0 C 30 46 78 46 78 0 C 78 -46 30 -46 0 0 C -30 46 -78 46 -78 0 Z" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="28" stroke-linejoin="round" transform="translate(0 6)"/>
    <path d="M -78 0 C -78 -46 -30 -46 0 0 C 30 46 78 46 78 0 C 78 -46 30 -46 0 0 C -30 46 -78 46 -78 0 Z" fill="none" stroke="url(#loop)" stroke-width="26" stroke-linejoin="round"/>
    <path d="M -78 0 C -78 -46 -30 -46 0 0" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(704 84) scale(0.82)">
    <circle r="16" fill="#ff1f3d" opacity="0.45" filter="url(#soft)"/>
    <circle r="15" fill="#f5f5f7" mask="url(#moonCut)"/>
  </g>

  <text x="640" y="338" class="sans name" text-anchor="middle">Noctis</text>
  <text x="640" y="392" class="sans h1" text-anchor="middle">AI coding agents that work through the <tspan class="red">night.</tspan></text>
  <text x="640" y="434" class="sans h2" text-anchor="middle">Pauses before the usage limit, waits for the reset, resumes — and keeps your queue moving.</text>

  <g class="sans chip">
    <rect x="212.5" y="478.5" width="199" height="42" rx="21" fill="#111115" stroke="#2a2a31"/>
    <path transform="translate(236 499.5)" d="M 3 -10 L -6 1.5 L -0.5 1.5 L -3 10 L 6.5 -2 L 1 -2 Z" fill="#ff3347"/>
    <text x="252" y="500" dominant-baseline="central">5–11 ms per hook</text>
    <rect x="423.5" y="478.5" width="241" height="42" rx="21" fill="#111115" stroke="#2a2a31"/>
    <g transform="translate(447 499.5)">
      <circle r="7.5" fill="none" stroke="#ff3347" stroke-width="2"/>
      <circle r="2.8" fill="#ff3347"/>
    </g>
    <text x="463" y="500" dominant-baseline="central">0 tokens per decision</text>
    <rect x="676.5" y="478.5" width="179" height="42" rx="21" fill="#111115" stroke="#2a2a31"/>
    <g transform="translate(700 499.5)">
      <rect x="-7.5" y="-7.5" width="15" height="15" rx="3" fill="none" stroke="#ff3347" stroke-width="2"/>
      <rect x="-3" y="-3" width="6" height="6" rx="1" fill="#ff3347"/>
    </g>
    <text x="716" y="500" dominant-baseline="central">one Go binary</text>
    <rect x="867.5" y="478.5" width="205" height="42" rx="21" fill="#111115" stroke="#2a2a31"/>
    <g transform="translate(891 499.5)" fill="#ff3347">
      <rect x="-7.5" y="-7.5" width="6.5" height="6.5" rx="1.2"/>
      <rect x="1" y="-7.5" width="6.5" height="6.5" rx="1.2"/>
      <rect x="-7.5" y="1" width="6.5" height="6.5" rx="1.2"/>
      <rect x="1" y="1" width="6.5" height="6.5" rx="1.2"/>
    </g>
    <text x="907" y="500" dominant-baseline="central">Win · Mac · Linux</text>
  </g>
  <text x="640" y="584" class="sans foot" text-anchor="middle">Claude Code · Codex CLI · Antigravity CLI · Droid · Copilot CLI  ·  github.com/synex1437/noctis</text>
</svg>
