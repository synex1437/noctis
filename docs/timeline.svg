<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Friday night to Monday morning: the plugin checkpoints at 92 percent, waits, resumes after the reset, saves at the weekly limit and relaunches the session on Monday (on Windows and Linux the scheduled task asks to wake the machine)">
  <title>Friday night to Monday morning</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#121a27"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8ff7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f8ff7" stop-opacity="0.04"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; }
      .cap { font-size: 15px; fill: #8b95a5; }
      .tick { font-size: 13px; fill: #8b95a5; }
      .card { fill: #111722; stroke-width: 1.5; }
      .ct { font-size: 15px; font-weight: 700; }
      .cd { font-size: 13px; fill: #9aa5b6; }
      .conn { stroke: #3a4352; stroke-width: 1.5; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="18" fill="url(#bg)" stroke="#232c3b"/>
  <text x="30" y="36" class="sans cap">Friday night → Monday morning — the 5-hour window (blue) and what the plugin did at each edge</text>

  <!-- night band -->
  <rect x="100" y="60" width="330" height="200" fill="#ffffff" fill-opacity="0.025"/>
  <text x="265" y="153" class="sans" font-size="13" fill="#8b95a5" text-anchor="middle">🌙 you are asleep</text>

  <line x1="60" y1="160" x2="1140" y2="160" stroke="#f0605d" stroke-width="1" stroke-dasharray="6 5" opacity="0.8"/>
  <text x="1140" y="153" class="sans" font-size="13" fill="#f0605d" text-anchor="end">92 % threshold</text>

  <path d="M100 236 L330 160 L470 160 L475 238 L700 190 L850 190 L850 246 L100 246 Z" fill="url(#area)"/>
  <path d="M100 236 L330 160 L470 160 L475 238 L700 190 L850 190" fill="none" stroke="#5b9bff" stroke-width="2"/>
  <path d="M1000 242 L1140 205 L1140 246 L1000 246 Z" fill="url(#area)"/>
  <path d="M1000 242 L1140 205" fill="none" stroke="#5b9bff" stroke-width="2"/>

  <line x1="60" y1="246" x2="850" y2="246" stroke="#3a4352" stroke-width="2"/>
  <line x1="1000" y1="246" x2="1140" y2="246" stroke="#3a4352" stroke-width="2"/>
  <path d="M912 238 L922 254 M924 238 L934 254" stroke="#6b7687" stroke-width="2" fill="none"/>
  <text x="925" y="226" class="sans" font-size="13" fill="#8b95a5" text-anchor="middle">weekend · PC asleep</text>

  <g class="conn">
    <line x1="100" y1="136" x2="100" y2="240"/>
    <line x1="330" y1="280" x2="330" y2="296"/>
    <line x1="470" y1="136" x2="470" y2="240"/>
    <line x1="700" y1="280" x2="700" y2="296"/>
    <line x1="1000" y1="136" x2="1000" y2="240"/>
  </g>

  <circle cx="100" cy="246" r="6" fill="#5b9bff"/>
  <circle cx="330" cy="246" r="6" fill="#f5b544"/>
  <circle cx="470" cy="246" r="6" fill="#3ecf8e"/>
  <circle cx="700" cy="246" r="6" fill="#5b9bff"/>
  <circle cx="1000" cy="246" r="6" fill="#3ecf8e"/>

  <g class="mono tick" text-anchor="middle">
    <text x="100" y="272">Fri 22:00</text>
    <text x="330" y="272">01:40</text>
    <text x="470" y="272">02:35</text>
    <text x="700" y="272">Sat 06:20</text>
    <text x="1000" y="272">Mon 09:00</text>
  </g>

  <g class="sans">
    <rect x="40" y="60" width="280" height="76" rx="10" class="card" stroke="#5b9bff"/>
    <text x="54" y="86" class="ct" fill="#5b9bff">Session starts</text>
    <text x="54" y="106" class="cd">TASKS.md: 48 open items</text>
    <text x="54" y="123" class="cd">Opus 5.5 · max · you go to bed</text>

    <rect x="205" y="296" width="280" height="76" rx="10" class="card" stroke="#f5b544"/>
    <text x="219" y="322" class="ct" fill="#f5b544">5h window hits 92 %</text>
    <text x="219" y="342" class="cd">checkpoint · waits inside the hook</text>
    <text x="219" y="359" class="cd">context kept, nothing to do</text>

    <rect x="345" y="60" width="280" height="76" rx="10" class="card" stroke="#3ecf8e"/>
    <text x="359" y="86" class="ct" fill="#3ecf8e">Reset at 02:35</text>
    <text x="359" y="106" class="cd">the same turn simply continues</text>
    <text x="359" y="123" class="cd">notification (+ webhook, if set)</text>

    <rect x="575" y="296" width="280" height="76" rx="10" class="card" stroke="#5b9bff"/>
    <text x="589" y="322" class="ct" fill="#5b9bff">Weekly reaches 95 %</text>
    <text x="589" y="342" class="cd">saved · relaunch scheduled</text>
    <text x="589" y="359" class="cd">early reset watched · PC may sleep</text>

    <rect x="875" y="60" width="280" height="76" rx="10" class="card" stroke="#3ecf8e"/>
    <text x="889" y="86" class="ct" fill="#3ecf8e">Mon 09:00 · auto-resume</text>
    <text x="889" y="106" class="cd">claude --resume · notification sent</text>
    <text x="889" y="123" class="cd">checkpoint loaded · queue at item 31</text>
  </g>
  <text x="1170" y="402" class="sans" font-size="14" fill="#8b95a5" text-anchor="end">Task Scheduler and systemd ask to wake the machine · a Mac relaunches once awake · a sleeper process where none of these exists</text>
</svg>
