<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="A night with noctis: it pauses before the 5-hour limit, waits out the reset in the same turn, keeps working down TASKS.md and stops cleanly when the queue is empty">
  <title>One night, one queue, no one at the keyboard</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#121a27"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 17px; }
      .sans { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif; }
      .ts { fill: #7f8ea3; }
      .user { fill: #f2f5f9; }
      .task { fill: #aab4c3; }
      .done { fill: #3ecf8e; }
      .pause { fill: #f5b544; }
      .hook { fill: #7fb0bd; }
      .dim { fill: #8b95a5; }
      .st { font-size: 17px; fill: #c7cfda; }
      .titlebar { font-size: 14px; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="499" rx="18" fill="url(#bg)" stroke="#232c3b"/>
  <rect x="20.5" y="20.5" width="1159" height="459" rx="14" fill="#0d1320" stroke="#26303f"/>
  <circle cx="44" cy="44" r="6" fill="#ff5f57"/>
  <circle cx="66" cy="44" r="6" fill="#febc2e"/>
  <circle cx="88" cy="44" r="6" fill="#28c840"/>
  <text x="600" y="49" class="mono dim titlebar" text-anchor="middle">claude — my-project</text>
  <g class="sans" font-size="13">
    <rect x="1002" y="32" width="158" height="26" rx="13" fill="#161e2e" stroke="#2a3548"/>
    <text x="1081" y="46" fill="#9aa5b6" text-anchor="middle" dominant-baseline="central">🌙 you: asleep</text>
  </g>
  <line x1="44" y1="68" x2="1156" y2="68" stroke="#1d2634"/>

  <g class="mono">
    <text x="44" y="104" class="ts">23:00</text>
    <text x="114" y="104" class="user">› Work through TASKS.md until every item is checked off.</text>

    <text x="44" y="138" class="ts">01:17</text>
    <text x="114" y="138" class="task">● Task 12/48 · refactor queue/worker.go <tspan class="done">— done, tests green</tspan></text>

    <text x="44" y="172" class="ts">01:40</text>
    <text x="114" y="172" class="dim">⋯ 5h window at 92 %: checkpoint saved, the hook holds the turn (status line: · ⏸️ 02:36)</text>

    <text x="44" y="206" class="ts">02:36</text>
    <text x="114" y="206" class="pause">⏸️ 5h limit 92%: waited 56m, continuing. <tspan class="dim">← same turn, context kept</tspan></text>

    <text x="44" y="240" class="ts">02:51</text>
    <text x="114" y="240" class="task">● Task 15/48 · retry logic + tests <tspan class="done">— done</tspan></text>

    <text x="44" y="274" class="ts">02:52</text>
    <text x="114" y="274" class="hook">⎿ Stop hook → Claude: [noctis] Queue continues: 33 open in TASKS.md. Take the next eligible item …</text>

    <text x="44" y="308" class="ts">04:40</text>
    <text x="114" y="308" class="task">● Task 31/48 · migrations + rollback test <tspan class="done">— done</tspan></text>

    <text x="44" y="342" class="ts">05:52</text>
    <text x="114" y="342" class="task">● Task 41/48 · docs/api.md regenerated <tspan class="done">— done</tspan></text>

    <text x="44" y="376" class="ts">06:55</text>
    <text x="114" y="376" class="done">✔ Queue finished — TASKS.md has no open items; stopping cleanly.</text>
  </g>

  <line x1="44" y1="404" x2="1156" y2="404" stroke="#1d2634"/>
  <text x="44" y="440" class="mono st">∞ 5h %61→07:35 · Wk %71●→Mon 21.09 09:00 · Opus 5.5/max · ctx 52%</text>
  <text x="1156" y="466" class="sans dim" font-size="13" text-anchor="end">⏸️ and ✔ lines are noctis notices shown to you; the Stop hook line is the instruction noctis hands Claude</text>
</svg>
