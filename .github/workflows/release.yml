name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency: release

jobs:
  version:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Release each version once, when ci first passes on main with it
        id: tag
        run: |
          tag="v$(jq -r .version .claude-plugin/plugin.json)"
          found=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || found=$?
          case $found in
            0) echo "$tag is already released" ;;
            2) echo "tag=$tag" >> "$GITHUB_OUTPUT" ;;
            *) exit "$found" ;;
          esac

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The same build the repo documents: Linux and Windows get one binary per CPU, macOS one
      # universal binary (bin/darwin/noctis) holding its x86_64 and arm64 builds unchanged.
      - name: Build all platforms from source
        run: node scripts/build.js
      # Signing is wired but dormant: with no secrets set this prints one line and changes nothing,
      # so the workflow behaves exactly as it does today. When a certificate exists, filling in the
      # repository secrets is the only change needed — and note the ORDER, because codesign rewrites
      # the binary: build → sign → notarise → checksum. codesign signs both builds inside the
      # universal bin/darwin/noctis, replacing the ad hoc signature Go's linker gives the arm64 one.
      # The checksum step below compares against the committed SHA256SUMS, so those must be
      # regenerated after signing, not before.
      - name: Sign macOS binaries (skipped without a certificate)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "no MACOS_CERTIFICATE secret; shipping unsigned macOS binaries (see docs/PUBLISHING.md §7)"
            exit 0
          fi
          echo "MACOS_CERTIFICATE is set, but signing must run on a macOS runner."
          echo "Move this job to macos-latest and follow docs/PUBLISHING.md §7 before enabling."
          exit 1

      - name: Sign Windows binaries (skipped without a certificate)
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if [ -z "$WINDOWS_CERTIFICATE" ]; then
            echo "no WINDOWS_CERTIFICATE secret; shipping unsigned Windows binaries (see docs/PUBLISHING.md §7)"
            exit 0
          fi
          echo "WINDOWS_CERTIFICATE is set, but signtool needs a Windows runner and an HSM-backed key."
          echo "Follow docs/PUBLISHING.md §7 before enabling."
          exit 1

      # Regenerate with the SAME code the repo uses (tests/harness.js) and require no diff. The
      # shell one-liner this replaces could not reproduce the committed manifest at all: its glob
      # missed the bare `bin/noctis` launcher and it emitted a different order, so `diff` failed on
      # every release. One generator, or the check is theatre.
      - name: Checksums must match the ones in the repo
        run: |
          node -e "require('./tests/harness.js').refreshChecksums()"
          git diff --exit-code -- bin/SHA256SUMS
      - name: Stage release assets under unique names
        run: |
          mkdir -p dist
          for p in linux-amd64 linux-arm64; do
            cp "bin/$p/noctis" "dist/noctis-$p"
          done
          # macOS has one universal binary. It also goes out under the per-CPU names releases
          # before 7.5.0 used, so a link or script that downloads one of those keeps working.
          for p in darwin-universal darwin-amd64 darwin-arm64; do
            cp bin/darwin/noctis "dist/noctis-$p"
          done
          for p in windows-amd64 windows-arm64; do
            cp "bin/$p/noctis.exe" "dist/noctis-$p.exe"
          done
          (cd dist && sha256sum noctis-* > SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/noctis-*'
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          files: dist/*
          generate_release_notes: true
