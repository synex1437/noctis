<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-label="Install in about a minute: add the marketplace, install, run setup (which asks which model does which work), reload, then write TASKS.md and trust it">
  <title>Install in about a minute: add the marketplace, install, run setup (which asks which model does which work), reload, then write TASKS.md and trust it</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#121a27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ff7"/>
      <stop offset="1" stop-color="#38c7d9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c2b"/>
      <stop offset="1" stop-color="#0f1622"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; }
      .eyebrow { font-size: 14px; font-weight: 700; fill: #7f8ea3; letter-spacing: 2.4px; }
      .title { font-size: 30px; font-weight: 800; fill: #f2f5f9; letter-spacing: -0.4px; }
      .step { font-size: 15px; font-weight: 700; fill: #dbe2ec; }
      .num { font-size: 15px; font-weight: 800; fill: #0b0f17; }
      .cmd { font-size: 14.5px; fill: #e6e9ee; }
      .prompt { font-size: 14.5px; fill: #6fb1ff; }
      .dim { font-size: 13px; fill: #8b95a5; }
      .q { font-size: 14px; fill: #f2f5f9; }
      .opt { font-size: 13.5px; fill: #aab4c3; }
      .optHi { font-size: 13.5px; fill: #f5b544; font-weight: 700; }
      .ok { font-size: 13.5px; fill: #3ecf8e; }
      .out { font-size: 13.5px; fill: #c7cfda; }
      .pill { font-size: 13px; font-weight: 600; fill: #dbe2ec; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="609" rx="18" fill="url(#bg)" stroke="#232c3b"/>

  <text x="48" y="58" class="sans eyebrow">INSTALL · SIXTY SECONDS</text>
  <text x="48" y="98" class="sans title">Four commands, one question. Then trust your TASKS.md.</text>

  <!-- step rail -->
  <g class="sans">
    <!-- 1 -->
    <g transform="translate(48 132)">
      <rect x="0" y="0" width="250" height="112" rx="14" fill="url(#card)" stroke="#26303f" filter="url(#shadow)"/>
      <circle cx="26" cy="28" r="13" fill="url(#accent)"/>
      <text x="26" y="28" class="num" text-anchor="middle" dominant-baseline="central">1</text>
      <text x="48" y="28" class="step" dominant-baseline="central">Add the marketplace</text>
      <text x="20" y="64" class="mono prompt">/plugin marketplace add</text>
      <text x="20" y="86" class="mono cmd">synex1437/noctis</text>
    </g>
    <path d="M 304 188 L 324 188" stroke="#2f3b50" stroke-width="2"/>
    <path d="M 319 183 L 325 188 L 319 193" fill="none" stroke="#2f3b50" stroke-width="2"/>
    <!-- 2 -->
    <g transform="translate(330 132)">
      <rect x="0" y="0" width="204" height="112" rx="14" fill="url(#card)" stroke="#26303f" filter="url(#shadow)"/>
      <circle cx="26" cy="28" r="13" fill="url(#accent)"/>
      <text x="26" y="28" class="num" text-anchor="middle" dominant-baseline="central">2</text>
      <text x="48" y="28" class="step" dominant-baseline="central">Install</text>
      <text x="20" y="64" class="mono prompt">/plugin install</text>
      <text x="20" y="86" class="mono cmd">noctis@noctis</text>
    </g>
    <path d="M 540 188 L 560 188" stroke="#2f3b50" stroke-width="2"/>
    <path d="M 555 183 L 561 188 L 555 193" fill="none" stroke="#2f3b50" stroke-width="2"/>
    <!-- 3 -->
    <g transform="translate(566 132)">
      <rect x="0" y="0" width="290" height="112" rx="14" fill="url(#card)" stroke="#3b4d6e" filter="url(#shadow)"/>
      <circle cx="26" cy="28" r="13" fill="url(#accent)"/>
      <text x="26" y="28" class="num" text-anchor="middle" dominant-baseline="central">3</text>
      <text x="48" y="28" class="step" dominant-baseline="central">Set up — it asks one thing</text>
      <text x="20" y="64" class="mono prompt">/noctis:setup</text>
      <text x="20" y="84" class="dim">asks which model does what</text>
      <text x="20" y="101" class="dim">edits settings.json, keeps a backup</text>
    </g>
    <path d="M 862 188 L 882 188" stroke="#2f3b50" stroke-width="2"/>
    <path d="M 877 183 L 883 188 L 877 193" fill="none" stroke="#2f3b50" stroke-width="2"/>
    <!-- 4 -->
    <g transform="translate(888 132)">
      <rect x="0" y="0" width="264" height="112" rx="14" fill="url(#card)" stroke="#26303f" filter="url(#shadow)"/>
      <circle cx="26" cy="28" r="13" fill="url(#accent)"/>
      <text x="26" y="28" class="num" text-anchor="middle" dominant-baseline="central">4</text>
      <text x="48" y="28" class="step" dominant-baseline="central">Reload</text>
      <text x="20" y="64" class="mono prompt">/reload-plugins</text>
      <text x="20" y="86" class="dim">no compiler, no Node, no Git Bash</text>
    </g>
  </g>

  <!-- the one question, then the trust step -->
  <g transform="translate(48 272)">
    <rect x="0" y="0" width="716" height="290" rx="14" fill="#0d1320" stroke="#26303f" filter="url(#shadow)"/>
    <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="24" r="6" fill="#febc2e"/>
    <circle cx="68" cy="24" r="6" fill="#28c840"/>
    <text x="358" y="29" class="mono dim" text-anchor="middle">setup — the one question</text>
    <line x1="20" y1="44" x2="696" y2="44" stroke="#1d2634"/>
    <g class="mono">
      <text x="24" y="74" class="q">Which model should do which kind of work?</text>
      <text x="24" y="98" class="opt">1 Code</text>
      <text x="124" y="98" class="opt">Opus 5.5·xhigh code · Opus 5.5·high research · Haiku 4.5 digests</text>
      <text x="24" y="120" class="opt">2 Search</text>
      <text x="124" y="120" class="opt">Opus 5.5·xhigh research · Opus 5.5·xhigh code · Haiku 4.5 digests</text>
      <text x="24" y="142" class="opt">3 Balanced</text>
      <text x="124" y="142" class="opt">Opus 5.5·high code · Opus 5.5·medium research · Haiku 4.5 digests</text>
      <text x="24" y="164" class="optHi">4 SYNEX</text>
      <text x="124" y="164" class="opt">Opus 5.5·max code · Opus 5.5·xhigh research · Haiku 4.5 digests</text>
      <text x="24" y="186" class="opt">5 custom</text>
      <text x="124" y="186" class="opt">a model for each of the six roles, with an effort where one applies</text>
      <text x="24" y="216" class="prompt">›</text>
      <text x="44" y="216" class="q">4</text>
      <text x="64" y="216" class="ok">✔ statusLine wired · model=opus · effort=max · permissions.defaultMode=auto</text>
      <line x1="20" y1="232" x2="696" y2="232" stroke="#1d2634"/>
      <text x="24" y="256" class="prompt">›</text>
      <text x="44" y="256" class="q">!noctis queue trust</text>
      <text x="44" y="278" class="out">This file may drive sessions: /home/you/my-project/TASKS.md</text>
    </g>
  </g>

  <!-- what you get -->
  <g transform="translate(792 272)" class="sans">
    <rect x="0" y="0" width="360" height="290" rx="14" fill="url(#card)" stroke="#26303f" filter="url(#shadow)"/>
    <text x="24" y="40" class="step">What the night looks like afterwards</text>
    <g class="pill">
      <text x="24" y="82"><tspan fill="#f5b544">⏸️</tspan> pauses before the limit, then resumes</text>
      <text x="24" y="118"><tspan fill="#3ecf8e">✔</tspan> works down a trusted TASKS.md</text>
      <text x="24" y="154"><tspan fill="#a78bfa">🔀</tspan> research in its own subagent</text>
      <text x="24" y="190"><tspan fill="#38c7d9">⟳</tspan> workflows rerun from saved results</text>
      <text x="24" y="226"><tspan fill="#6fb1ff">🌐</tspan> notices in the language you type</text>
      <text x="24" y="262"><tspan fill="#e6e9ee">◎</tspan> no model calls · 5–11 ms per hook</text>
    </g>
  </g>

  <text x="1152" y="594" class="sans dim" text-anchor="end">Windows · macOS · Linux · one binary, prebuilt for six platforms · also Codex CLI, Antigravity CLI, Droid, Copilot CLI</text>
</svg>
