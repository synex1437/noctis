<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="376" viewBox="0 0 1200 376" role="img" aria-label="The noctis status line: 5-hour window, weekly window with pace marker and ETA, model and effort, context">
  <title>The noctis status line</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#121a27"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif; }
      .line { font-size: 18px; fill: #dfe5ee; }
      .dim { font-size: 18px; fill: #8b95a5; }
      .st { font-size: 18px; fill: #c7cfda; }
      .call { font-size: 15px; fill: #c7cfda; }
      .note { font-size: 14px; fill: #8b95a5; }
      .conn { stroke: #4a5568; stroke-width: 1.5; fill: none; }
      .titlebar { font-size: 14px; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="375" rx="16" fill="url(#bg)" stroke="#232c3b"/>
  <rect x="20.5" y="20.5" width="1159" height="190" rx="12" fill="#0d1320" stroke="#232c3b"/>
  <circle cx="44" cy="44" r="6" fill="#ff5f57"/>
  <circle cx="66" cy="44" r="6" fill="#febc2e"/>
  <circle cx="88" cy="44" r="6" fill="#28c840"/>
  <text x="600" y="49" class="mono dim titlebar" text-anchor="middle">claude — my-project</text>
  <text x="44" y="92" class="mono line">&gt; Implement the retry logic in queue/worker.go and add tests</text>
  <text x="44" y="122" class="mono dim">● Working… (Opus 5.5, effort max)</text>
  <line x1="44" y1="142" x2="1156" y2="142" stroke="#232c3b"/>
  <!-- the status line exactly as noctis prints it: one plain line, no colours;
       textLength keeps the callout positions right in narrower monospace fonts -->
  <text x="44" y="176" class="mono st" textLength="1041" lengthAdjust="spacing">∞ 5h %41→14:35 · Wk %60▼→Mon 28.09 09:00 · ⌛ weekly threshold ~14h 27m · Opus 5.5/max · ctx 37%</text>
  <g class="conn">
    <path d="M131 192 V244"/>
    <path d="M662 192 V244"/>
    <path d="M1047 192 V244"/>
    <path d="M353 192 V294"/>
    <path d="M912 192 V294"/>
  </g>
  <g class="sans call">
    <circle cx="131" cy="244" r="3" fill="#5b9bff"/>
    <text x="28" y="268">5-hour window · 41 % used · resets 14:35</text>
    <circle cx="662" cy="244" r="3" fill="#f5b544"/>
    <text x="662" y="268" text-anchor="middle">weekly pause point (95 %) in ~14h 27m at this rate</text>
    <circle cx="1047" cy="244" r="3" fill="#9aa5b6"/>
    <text x="1047" y="268" text-anchor="middle">context used</text>
    <circle cx="353" cy="294" r="3" fill="#3ecf8e"/>
    <text x="353" y="318" text-anchor="middle">weekly · 60 % used · ▼ above an even pace · resets Mon 28.09 09:00</text>
    <circle cx="912" cy="294" r="3" fill="#eef2f7"/>
    <text x="912" y="318" text-anchor="middle">model / effort</text>
  </g>
  <text x="600" y="354" class="sans note" text-anchor="middle">when the usage endpoint reports a Fable bucket: <tspan class="mono">· Fable %60</tspan> — in a Fable session also: <tspan class="mono">· ⌛ Fable ~1d 3h 0m</tspan></text>
</svg>
