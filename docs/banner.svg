<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Noctis — a Claude Code plugin that pauses before the 5-hour or weekly usage limit and resumes after the reset">
  <title>Noctis</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#141c2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#4f8ff7" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4f8ff7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ff7"/>
      <stop offset="1" stop-color="#38c7d9"/>
    </linearGradient>
    <linearGradient id="loopBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ff7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4f8ff7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38c7d9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2a44"/>
      <stop offset="1" stop-color="#0f1626"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif; }
      .h1 { font-size: 56px; font-weight: 800; fill: #f2f5f9; letter-spacing: -1px; }
      .h2 { font-size: 23px; fill: #a9b3c2; }
      .brand { font-size: 15px; font-weight: 700; fill: #7f8ea3; letter-spacing: 2px; }
      .chip { font-size: 17px; font-weight: 500; fill: #dbe2ec; }
      .icon { font-weight: 700; }
      .foot { font-size: 14px; fill: #8b95a5; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="419" rx="22" fill="url(#bg)" stroke="#232c3b"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="22" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="22" fill="url(#glow)"/>

  <!-- background infinity path, sweeping across the whole banner -->
  <path d="M 120 300 C 120 120 520 120 640 300 C 760 480 1160 480 1160 300 C 1160 120 760 120 640 300 C 520 480 120 480 120 300 Z" fill="none" stroke="url(#loopBg)" stroke-width="3"/>
  <path d="M 120 300 C 120 120 520 120 640 300 C 760 480 1160 480 1160 300 C 1160 120 760 120 640 300 C 520 480 120 480 120 300 Z" fill="none" stroke="url(#loopBg)" stroke-width="14" filter="url(#soft)" opacity="0.35"/>

  <!-- logo tile -->
  <g filter="url(#shadow)">
    <rect x="72" y="86" width="248" height="248" rx="56" fill="url(#tile)" stroke="#2b3b5a"/>
  </g>
  <rect x="73" y="87" width="246" height="120" rx="55" fill="#ffffff" fill-opacity="0.035"/>
  <g transform="translate(196 210)">
    <path d="M -78 0 C -78 -46 -30 -46 0 0 C 30 46 78 46 78 0 C 78 -46 30 -46 0 0 C -30 46 -78 46 -78 0 Z" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="30" stroke-linejoin="round" transform="translate(0 6)"/>
    <path d="M -78 0 C -78 -46 -30 -46 0 0 C 30 46 78 46 78 0 C 78 -46 30 -46 0 0 C -30 46 -78 46 -78 0 Z" fill="none" stroke="url(#loop)" stroke-width="26" stroke-linejoin="round"/>
    <path d="M -78 0 C -78 -46 -30 -46 0 0" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- a small moon: the name is Latin for "of the night" -->
  <g transform="translate(286 118)">
    <circle cx="0" cy="0" r="15" fill="#f5d67a" opacity="0.95"/>
    <circle cx="7" cy="-4" r="13" fill="#152036"/>
  </g>
  <text x="380" y="118" class="sans brand">NOCTIS · CLAUDE CODE · CODEX CLI · ANTIGRAVITY CLI · DROID · COPILOT CLI</text>
  <text x="378" y="184" class="sans h1">AI coding agents that work</text>
  <text x="378" y="246" class="sans h1">through the night.</text>
  <text x="380" y="290" class="sans h2">Pauses before the usage limit, waits for the reset, resumes —</text>
  <text x="380" y="320" class="sans h2">and keeps your task queue moving while you sleep.</text>

  <g class="sans chip">
    <rect x="380" y="346" width="197" height="40" rx="20" fill="#121a29" stroke="#2a3548"/>
    <text x="478.5" y="367" text-anchor="middle" dominant-baseline="central"><tspan class="icon" fill="#f5b544">⚡</tspan><tspan dx="7">5–11 ms per hook</tspan></text>

    <rect x="589" y="346" width="242" height="40" rx="20" fill="#121a29" stroke="#2a3548"/>
    <text x="710" y="367" text-anchor="middle" dominant-baseline="central"><tspan class="icon" fill="#3ecf8e">◎</tspan><tspan dx="7">0 tokens per decision</tspan></text>

    <rect x="843" y="346" width="180" height="40" rx="20" fill="#121a29" stroke="#2a3548"/>
    <text x="933" y="367" text-anchor="middle" dominant-baseline="central"><tspan class="icon" fill="#38c7d9">▣</tspan><tspan dx="7">one Go binary</tspan></text>

    <rect x="1035" y="346" width="205" height="40" rx="20" fill="#121a29" stroke="#2a3548"/>
    <text x="1137.5" y="367" text-anchor="middle" dominant-baseline="central"><tspan class="icon" fill="#a78bfa">⊞</tspan><tspan dx="7">Win · Mac · Linux</tspan></text>
  </g>

  <text x="1228" y="404" class="sans foot" text-anchor="end">MIT</text>
</svg>
